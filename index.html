:root{
  --mid:#0B1424;--violet:#1E3A66;--lav:#7DD3C8;--pale:#CFE3F2;
  --bg:#F2F6FB;--bg2:#E3ECF6;--panel:#FFFFFF;--card:#FFFFFF;--card2:#F7FAFD;--card3:#DCE7F3;
  --line:rgba(11,20,36,.12);--line2:rgba(11,20,36,.07);
  --ink:#0B1424;--ink2:#18243A;--muted:#56677D;--faint:#5B7BA6;
  --accent:#1E3A66;--accent2:#152A4C;--btn:#1E3A66;--btn2:#182C4F;--onbtn:#fff;
  --good:#0F8A6B;--warn:#A86400;--bad:#C23A51;--coral:#E8603F;--teal:#0E9F8E;
  --shadow:0 18px 40px rgba(11,20,36,.12);--shadow2:0 4px 14px rgba(11,20,36,.06);
  --glow:0 0 0 1px rgba(30,58,102,.25),0 10px 26px rgba(30,58,102,.18);
  --r:18px;--r2:13px;--r3:10px;
  --serif:"Fraunces","Iowan Old Style",Georgia,serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#080F1C;--bg2:#0B1424;--panel:#111B2D;--card:#141F33;--card2:#1A2740;--card3:#1E3A66;
  --line:rgba(125,211,200,.18);--line2:rgba(125,211,200,.1);
  --ink:#EAF2FA;--ink2:#CFE3F2;--muted:#A3B8CF;--faint:#5B7BA6;
  --accent:#7DD3C8;--accent2:#D7E6F4;--btn:#2F6FAE;--btn2:#5B7BA6;--onbtn:#fff;
  --good:#4CC38A;--warn:#E9B24C;--bad:#F07C8C;--coral:#FF8A6B;--teal:#2DD4BF;
  --shadow:0 18px 44px rgba(0,0,0,.45);--shadow2:0 6px 18px rgba(0,0,0,.3);
  --glow:0 0 0 1px rgba(125,211,200,.35),0 10px 30px rgba(30,58,102,.45);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;font-size:14.5px;line-height:1.5;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:none}
html[data-theme="dark"] body::before{background:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--accent)}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:600;letter-spacing:-.01em}
svg{display:block}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
::selection{background:rgba(125,211,200,.5)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--card3);border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
[hidden]{display:none!important}

/* ================= sidebar (midnight, starlight) ================= */
.app{position:relative;z-index:1;min-height:100vh;display:flex}
.side{width:284px;flex:0 0 284px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:40;color:#CFE3F2;
  background:#0B1424;box-shadow:8px 0 30px rgba(11,20,36,.18)}
.brand{display:flex;align-items:center;gap:11px;color:inherit;text-align:left;padding:18px 18px 14px;border-bottom:1px solid rgba(207,227,242,.1)}
.brand .mk{width:42px;height:42px;flex:0 0 42px;border-radius:13px;display:grid;place-items:center;background:#1E3A66;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 16px rgba(0,0,0,.35)}
.brand .mk img{width:27px;height:auto;display:block}
.brand b{display:block;font-family:var(--serif);font-size:19px;line-height:1.05;font-weight:600;color:#fff}
.brand small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7DD3C8;margin-top:4px;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{flex:1;overflow-y:auto;padding:4px 12px 12px;scrollbar-width:thin;scrollbar-color:rgba(207,227,242,.2) transparent}
.nav .gl{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#7D97B8;padding:12px 0 5px 50px}
.nav .st{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:6px 10px;border-radius:14px;text-align:left;color:#D3E6F2;transition:background .15s}
.nav .st::before{content:"";position:absolute;left:23px;top:-12px;bottom:-12px;width:2px;background:rgba(207,227,242,.13);pointer-events:none}
.nav .st:first-of-type::before{top:50%}.nav .st:last-of-type::before{bottom:50%}
.nav .st.set .n{background:transparent;border-style:dashed}.nav .st.set.on .n{background:#CFE3F2;border-style:solid}.nav .st.set .tx b .ic{display:none}
.nav .st .n{position:relative;z-index:1;width:28px;height:28px;flex:0 0 28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#CFE3F2;background:#13213A;border:1.5px solid rgba(207,227,242,.32);transition:all .2s}
.nav .st .n .ic{width:14px;height:14px;stroke-width:3}
.nav .st .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.nav .st .tx b{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .st .tx b .ic{width:15px;height:15px;opacity:.65}
.nav .st .tx small{font-size:11.5px;color:#A9BED4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.nav .st:hover{background:rgba(207,227,242,.07)}
.nav .st.done .n{background:#1baf7a;border-color:#1baf7a;color:#fff}
.nav .st.on{background:rgba(207,227,242,.17);box-shadow:inset 3px 0 0 #CFE3F2}
.nav .st.on .n{background:#CFE3F2;border-color:#CFE3F2;color:#0B1424;box-shadow:0 0 0 5px rgba(207,227,242,.14),0 0 18px rgba(125,211,200,.6)}
.nav .st.on .tx small{color:#D3E6F2}
.nav .bd{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#7DD3C8;color:#0B1424;font-size:11px;font-weight:700;display:grid;place-items:center;flex:0 0 auto}
.nav .bd.warn{background:#E9B24C}.nav .bd.bad{background:#F07C8C}
.sbox{margin:0 14px 10px;padding:11px 12px;border-radius:14px;background:rgba(207,227,242,.07);border:1px solid rgba(207,227,242,.12);font-size:13px;color:#CFE3F2}
.sbox b{color:#fff;font-family:var(--serif);font-size:16px}.sbox .sub{color:#A9BED4}
.sbox .btn{background:#CFE3F2;color:#0B1424}
.hbar{display:flex;gap:2px;height:7px;border-radius:7px;overflow:hidden;margin:8px 0 6px;background:rgba(207,227,242,.1)}
.hbar i{display:block;height:100%}
.sfoot{display:flex;gap:6px;padding:10px 14px 16px;border-top:1px solid rgba(207,227,242,.1)}
.sfoot button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 10px;border-radius:11px;font-size:12.5px;font-weight:600;color:#D3E6F2;background:rgba(207,227,242,.07)}
.sfoot button:hover,.sfoot button.on{background:rgba(207,227,242,.16);color:#fff}
.sfoot .ic{width:16px;height:16px}
.scrim{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:11px 26px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line2)}
.top .burger{display:none}
.crumb{display:flex;align-items:center;gap:9px;flex:0 0 auto;min-width:0}
.crumb .cn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--btn);color:#fff;font-weight:700;font-size:13px;flex:0 0 30px}
.crumb .cn .ic{width:16px;height:16px}
.crumb small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.crumb b{display:none;font-family:var(--serif);font-size:16px;line-height:1.1}
.srch{position:relative;flex:1;max-width:460px;margin:0 auto}
.srch>.ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.srch input[type=search]{width:100%;padding:10px 14px 10px 40px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--ink);outline:0}
.srch input[type=search]::placeholder{color:var(--faint)}
.srch input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(30,58,102,.14)}
.srch .res{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:420px;overflow:auto;display:none;z-index:60;padding:6px}
.srch .res.open{display:block}
.srch .res button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:7px 9px;border-radius:10px}
.srch .res button:hover,.srch .res button.hl{background:var(--card2)}
.srch .res .tb{flex:1;min-width:0}.srch .res b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.srch .res small{font-size:11.5px;color:var(--muted)}
.srch .none{padding:10px;font-size:13px;color:var(--muted)}
.qtyp{font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.qtyp.ok{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}.qtyp.low{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}.qtyp.out{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.hacts{display:flex;align-items:center;gap:8px;flex:0 0 auto}

/* the 1-2-3 guide on every page */
.guide{margin-bottom:18px;padding:14px 16px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--lav)}

.guide .gh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}

.gs3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

.gs3 b{display:block;font-size:13.5px;line-height:1.3}
.gs3 small{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
.view{position:relative;padding:22px 26px 80px;max-width:1320px;width:100%;margin:0 auto;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.phead h1{font-size:30px;line-height:1.1;margin-top:3px}
.phead p{color:var(--muted);font-size:13.5px;margin-top:4px;max-width:720px}
.phead .pa{display:flex;gap:8px;flex-wrap:wrap}
.next{display:flex;align-items:center;gap:12px;margin-top:28px;padding:14px 16px;border-radius:16px;border:1px dashed var(--line);flex-wrap:wrap}

.next>span:first-child{display:flex;align-items:center;gap:7px}

/* ================= generic ================= */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow2);min-width:0;position:relative}
.card h3,.ch h3{font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .ic{color:var(--accent)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:12.5px}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.kick{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 17px;border-radius:12px;background:var(--btn);color:var(--onbtn);font-weight:600;font-size:13.5px;border:1px solid transparent;transition:background .15s,transform .1s,box-shadow .15s;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--btn2);box-shadow:0 6px 16px rgba(30,58,102,.3)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--card2);box-shadow:none}
.btn.soft{background:var(--card2);color:var(--ink);border-color:var(--line)}
.btn.soft:hover{background:var(--card3);box-shadow:none}
.btn.danger{background:transparent;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.btn.danger:hover{background:color-mix(in srgb,var(--bad) 10%,transparent);box-shadow:none}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:10px}
.btn:disabled{opacity:.45;pointer-events:none}
.btn .ic{width:16px;height:16px}
label.btn{cursor:pointer}
.icb{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--ink2);flex:0 0 36px;transition:background .15s,transform .1s}
.icb:hover{background:var(--card2)}.icb:active{transform:scale(.95)}.icb:disabled{opacity:.35;pointer-events:none}
.icb.sm{width:30px;height:30px;flex:0 0 30px;border-radius:9px}.icb.sm .ic{width:15px;height:15px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row.nw{flex-wrap:nowrap}
.sp{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--ink2);transition:all .15s;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--btn);border-color:var(--btn);color:#fff}
.chip b{font-weight:700;opacity:.8}
.chip .ic{width:14px;height:14px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;background:var(--card3);color:var(--ink2);white-space:nowrap}
.pill .ic{width:13px;height:13px}
.pill.good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.pill.warnp{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.kind{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.pill.st i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.st.ok{background:color-mix(in srgb,var(--good) 13%,transparent);color:var(--good)}
.pill.st.low{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.pill.st.out{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.goodt{color:var(--good)}.badt{color:var(--bad)}.warnt{color:var(--warn)}
.goodt .ic,.badt .ic{display:inline-block;vertical-align:-3px;width:16px;height:16px}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;padding:10px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);outline:0;transition:border-color .15s,box-shadow .15s;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(30,58,102,.14)}
input[readonly]{opacity:.7}
textarea{resize:vertical;min-height:70px;line-height:1.5}
select{max-width:100%}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.fld{margin-bottom:12px;min-width:0}
input[type=checkbox]{accent-color:var(--violet);width:17px;height:17px;flex:0 0 17px}
.cur{display:flex;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:0 10px;transition:border-color .15s,box-shadow .15s;min-width:0}
.cur:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(30,58,102,.14)}
.cur span{color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.cur input{border:0!important;background:transparent!important;box-shadow:none!important;padding:10px 6px!important;min-width:0}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty .eic{width:68px;height:68px;margin:0 auto 12px;border-radius:22px;display:grid;place-items:center;color:#fff;background:#1E3A66;box-shadow:0 12px 24px rgba(30,58,102,.3)}
.empty .eic .ic{width:30px;height:30px}

.empty>div{max-width:520px;margin:0 auto}

.tip{font-size:12.5px;color:var(--muted);background:var(--card2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:9px;align-items:flex-start}
.tip .ic{color:var(--accent);margin-top:1px}
.note{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;border-radius:12px;padding:9px 11px;background:var(--card2);border:1px solid var(--line)}
.note.warn{background:color-mix(in srgb,var(--warn) 10%,var(--card));border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.note .ic{color:var(--warn);margin-top:1px}
.okmsg{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--good) 9%,var(--card));color:var(--ink2);font-size:13.5px}

.okmsg.big{padding:18px}
.hr{height:1px;background:var(--line2);margin:14px 0}
.mt{margin-top:16px}.mt8{margin-top:8px}.mb{margin-bottom:16px}
.bar{height:7px;border-radius:7px;background:var(--card3);overflow:hidden;margin-top:7px}

.list{display:flex;flex-direction:column;gap:7px}
.subs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px;padding:5px;background:var(--card);border:1px solid var(--line);border-radius:15px;width:max-content;max-width:100%}
.subs button{padding:8px 15px;border-radius:11px;font-size:13.5px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}
.subs button:hover{color:var(--ink);background:var(--card2)}
.subs button.on{background:var(--btn);color:#fff;box-shadow:0 4px 12px rgba(30,58,102,.3)}
.subs .bd{font-size:10.5px;font-weight:700;padding:0 6px;border-radius:10px;background:rgba(255,255,255,.2)}
.subs button:not(.on) .bd{background:var(--card3);color:var(--ink2)}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg button{padding:7px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px;color:var(--ink2)}
.seg button .ic{width:15px;height:15px}
.seg button.on{background:var(--btn);border-color:var(--btn);color:#fff}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.tools select{width:auto;min-width:150px;padding:8px 10px}
.srch2{position:relative;flex:1 1 260px;max-width:380px}
.srch2 .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.srch2 input[type=search]{padding:9px 12px 9px 36px;background:var(--card)}
.vt{display:flex;padding:3px;border-radius:11px;background:var(--card);border:1px solid var(--line)}
.vt button{width:32px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.vt button.on{background:var(--btn);color:#fff}
.vt .ic{width:16px;height:16px}
.sumbar{display:flex;gap:8px;flex-wrap:wrap}
.sumbar span{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:8px 14px;display:flex;flex-direction:column;min-width:120px}
.sumbar small{font-size:11px;color:var(--muted)}.sumbar b{font-family:var(--serif);font-size:19px}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;margin-bottom:16px;background:var(--lav);border:1px solid var(--line);font-size:13px}
.banner>.ic{color:var(--accent);width:22px;height:22px}.banner>span{flex:1}

/* thumbnails */
.th{display:grid;place-items:center;flex:0 0 auto;border-radius:30%;color:#fff;background:var(--c);box-shadow:0 4px 10px color-mix(in srgb,var(--c) 30%,transparent);overflow:hidden}

.th.ph{background:#fff;box-shadow:0 0 0 1px var(--line)}

/* ================= dashboard ================= */
.sphere{position:relative;border-radius:var(--r);overflow:hidden;background:#FFFFFF;border:1px solid var(--line);box-shadow:var(--shadow);min-height:420px}
html[data-theme="dark"] .sphere{background:#172338}
.sphere canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:pan-y}
.sphere canvas:active{cursor:grabbing}
.sphere .ov{position:absolute;left:18px;top:16px;right:18px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:10px}
.sphere .ov h3{font-size:20px}
.sphere .ov .sub{max-width:330px}
.sphere .ovr{pointer-events:auto}
.sphere .ovr .seg button{background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(6px)}
.sphere .ovr .seg button.on{background:var(--btn)}
.sphere .lg{position:absolute;left:16px;bottom:13px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);pointer-events:none}
.sphere .lg span{display:flex;align-items:center;gap:6px}.sphere .lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.sphere .hint{position:absolute;right:16px;bottom:13px;font-size:11px;color:var(--faint);pointer-events:none}
.sphere .tipbox{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:8px 11px;border-radius:11px;font-size:12.5px;max-width:250px;box-shadow:var(--shadow);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;z-index:3}
.sphere .tipbox.on{opacity:1;transform:none}
.sphere .tipbox b{display:block}.sphere .tipbox small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.valc .bigv,.bigv{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1.1;margin:4px 0 8px;overflow-wrap:anywhere}
.hrow{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;font-size:13px;background:var(--card2);text-align:left;width:100%}
.hrow:hover{background:var(--card3)}.hrow b{margin-left:auto}
.ring{position:relative;display:grid;place-items:center;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring circle{transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring .rc{position:absolute;text-align:center;line-height:1.1}
.ring .rc b{display:block;font-family:var(--serif)}
.ring .rc small{font-size:10.5px;color:var(--muted)}
.qa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.qa button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;border-radius:14px;background:var(--card2);border:1px solid var(--line2);text-align:left;transition:transform .15s,border-color .15s,background .15s}

.qa button .ic{width:22px;height:22px;color:var(--accent);margin-bottom:4px}
.qa b{font-size:13.5px}.qa small{font-size:11.5px;color:var(--muted)}
.qa.big{grid-template-columns:repeat(5,minmax(0,1fr))}

.stat{display:flex;gap:13px;align-items:center;text-align:left;cursor:pointer;transition:transform .15s,border-color .15s}
.stat:hover{transform:translateY(-2px);border-color:var(--accent)}
.stat .si{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--card3);color:var(--accent);flex:0 0 44px}

.stat .v{display:block;font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.05}
.stat .l{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.warnc{border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.warnc .si{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.arow,.mrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--card2);border:1px solid var(--line2);min-width:0}
.arow .tb,.mrow .tb{flex:1;min-width:0}
.arow b,.mrow b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow small,.mrow small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:0 0 32px;background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.mic.p{background:color-mix(in srgb,var(--good) 13%,transparent);color:var(--good)}
.mic .ic{width:16px;height:16px}
.mq{font-family:var(--serif);font-weight:600;font-size:16px;white-space:nowrap}.mq.p{color:var(--good)}.mq.n{color:var(--bad)}
.dh{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 2px 2px}
.dh:first-child{margin-top:0}
.cm{display:flex;flex-direction:column;align-items:center;font-family:var(--serif);font-size:20px;font-weight:600;line-height:1;min-width:58px}
.cm small{font-family:var(--sans);font-size:10px;color:var(--muted);font-weight:500;margin-top:2px}.cm.z{color:var(--bad)}
.rk{width:22px;height:22px;border-radius:7px;background:var(--card3);display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:0 0 22px}

/* ================= item cards & tables ================= */
.icards{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}
.icard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow2);padding:14px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.icard::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--c)}
.icard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.icard.out{border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.icard.low{border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}
.ihead{display:flex;align-items:center;gap:10px;text-align:left;width:100%;min-width:0}
.ihead .tb{flex:1;min-width:0}.ihead b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ihead small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.qrow .big{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1}.qrow .u{font-size:12px;color:var(--muted);margin-left:6px}
.icard .bar{margin-top:0}
.facts3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.facts3 span{background:var(--card2);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;min-width:0}
.facts3 small{font-size:10.5px;color:var(--muted)}.facts3 b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iacts{display:flex;align-items:center;gap:6px}
.iacts .loc{display:flex;align-items:center;gap:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}.iacts .loc .ic{width:13px;height:13px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.facts span{background:var(--card2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;min-width:0}
.facts small{font-size:10.5px;color:var(--muted)}
.q{display:inline-grid;place-items:center;width:13px;height:13px;border-radius:50%;background:var(--card3);color:var(--muted);font-size:9px;font-style:normal;font-weight:700;vertical-align:1px;cursor:help}
[data-tip]{cursor:help}button[data-tip],.chart [data-tip]{cursor:pointer}.facts b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap;background:var(--card)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap}
.tbl td.wrap{white-space:normal;min-width:200px}
.tbl .r{text-align:right}
.tbl tr:hover td{background:color-mix(in srgb,var(--accent) 4%,transparent)}
.tbl tr.bad td{background:color-mix(in srgb,var(--bad) 7%,transparent)}
.tbl tr.opn td{background:color-mix(in srgb,var(--warn) 6%,transparent)}
.tblwrap{overflow:auto;max-height:560px;border:1px solid var(--line2);border-radius:12px}
.tbl.sch th{position:sticky;top:0;z-index:1}
.tbl input,.tbl .cur input{padding:7px 9px}
.tbl.chs td{padding:6px 8px}.tbl.chs input[type=text]{min-width:70px}.tbl.chs input[data-f=n]{min-width:150px}
.tlink{display:flex;align-items:center;gap:8px;text-align:left;font-weight:600;color:var(--ink);max-width:340px}
.tlink span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlink:hover span{text-decoration:underline}
.abc{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;font-weight:700;font-size:12px;color:#fff}
.abc.A{background:var(--good)}.abc.B{background:#2a78d6}.abc.C{background:var(--faint)}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi small{font-size:12px;color:var(--muted)}.kpi b{font-family:var(--serif);font-size:27px;line-height:1.15}.kpi span{font-size:12px;color:var(--muted)}

/* ================= lots, refunds, Etsy ================= */
.pill.exp{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.expc{border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.lotbox{margin:4px 0 12px;padding:12px 14px;border-radius:14px;background:var(--card2);border:1px dashed var(--line)}
.lotbox b{display:block;font-size:13.5px}.lotbox small{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.lotin{display:flex;gap:10px;align-items:flex-start;padding:10px 12px 0;border-radius:12px;background:color-mix(in srgb,var(--lav) 18%,var(--card));margin-bottom:10px}
.lotin>.ic{margin-top:30px;color:var(--accent)}
.tbl tr.lotrow td{background:var(--card2);padding-top:4px}
.tbl tr.lotrow input{padding:6px 9px}
.rbox{margin:6px 0 4px;padding:12px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--line2)}
.rbox>.row b{display:flex;align-items:center;gap:7px;font-size:13.5px}.rbox>.row b .ic{color:var(--accent)}
.opt2{display:flex;flex-direction:column;gap:6px}
.opt2>b{display:flex;align-items:center;gap:8px;font-size:15px}.opt2>b .ic{color:var(--accent)}
.howto{margin:4px 0 10px 18px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.howto b{color:var(--ink);font-weight:600}
.trace{display:flex;flex-direction:column;gap:6px;position:relative}
.trace .tr{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:12px;background:var(--card2)}
.trace .tr .tb{flex:1;min-width:0}.trace .tr b{display:block;font-size:13px}.trace .tr small{display:block;font-size:11.5px;color:var(--muted)}
.trace .chip{padding:1px 8px;font-size:11px}
.vs .hlb{background:color-mix(in srgb,var(--bad) 12%,var(--card))}
/* ================= modals: lines, previews ================= */
.mdl{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:rgba(11,20,36,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .2s}
.mdl .box{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:22px;animation:pop .25s cubic-bezier(.2,.8,.2,1);outline:0}
.mdl .box.w{width:min(800px,100%)}
@keyframes pop{from{transform:scale(.95);opacity:0}}
.mdl .mh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:16px}
.mdl .mt1{display:flex;gap:12px;align-items:center;min-width:0}
.mdl .mi{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--card3);color:var(--accent);flex:0 0 40px}
.mdl .mh h2{font-size:21px;line-height:1.15}.mdl .mh small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.mdl .mf{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.sw{display:flex;gap:7px;flex-wrap:wrap}
.sw button{width:28px;height:28px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.sw button.on{box-shadow:0 0 0 2px var(--ink)}
.preview{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--card2);font-size:13px;color:var(--muted)}
.preview b{color:var(--ink)}.preview .ic{width:15px;height:15px}
.preview:empty{display:none}
.lines{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.lh,.line{display:grid;grid-template-columns:minmax(0,1fr) 80px 130px 90px 30px;gap:8px;align-items:center}
.lh{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.line .lt{font-weight:600;text-align:right;font-size:13px}
.line .lw{grid-column:1/-1;margin-top:-3px;font-size:11.5px}
.line .lw .ic{display:inline-block;width:14px;height:14px;vertical-align:-3px;margin-right:3px}
.line input.lq{text-align:center;padding:10px 6px}
.sumup{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:6px}
.sumup div{background:var(--card2);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;min-width:0}
.sumup small{font-size:10.5px;color:var(--muted)}.sumup b{font-size:14.5px;white-space:nowrap}
.sumup .pf{background:color-mix(in srgb,var(--good) 13%,var(--card));}.sumup .pf b{font-family:var(--serif);font-size:19px;color:var(--good)}.sumup .pf span{font-size:11px;color:var(--muted)}
.sumup .pf.neg{background:color-mix(in srgb,var(--bad) 12%,var(--card))}.sumup .pf.neg b{color:var(--bad)}
.ipanel .bcwrap{max-width:320px;padding:8px;background:#fff;border-radius:10px;border:1px solid var(--line)}
.bc{display:block;max-width:100%}
.bcw{display:flex;flex-direction:column;align-items:center;width:100%;background:#fff}.bcw small{font:11px/1.2 ui-monospace,Menlo,Consolas,monospace;color:#000;letter-spacing:.04em;margin-top:2px}
.cam{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3}
.cam video{width:100%;height:100%;object-fit:cover}
.cam i{position:absolute;left:12%;right:12%;top:45%;height:2px;background:#F07C8C;box-shadow:0 0 12px #F07C8C}
.lpick{display:flex;flex-direction:column;gap:4px;max-height:330px;overflow:auto;border:1px solid var(--line2);border-radius:12px;padding:6px}
.lpick label{gap:10px;padding:6px 8px;border-radius:10px;cursor:pointer}.lpick label:hover{background:var(--card2)}
.lpick .tb{flex:1;min-width:0;font-size:13.5px;font-weight:500}.lpick small{display:block;color:var(--muted);font-size:11.5px}
.welcome .wl{width:92px;height:92px;border-radius:24px;margin:2px auto 14px;display:block;box-shadow:0 12px 28px rgba(11,20,36,.3)}

/* ================= recipes ================= */
.rgrid{grid-template-columns:minmax(260px,320px) minmax(0,1fr)}
.rlist{align-self:start;position:sticky;top:80px;max-height:calc(100vh - 100px);overflow:auto}
.rpick{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;text-align:left;width:100%;border:1px solid transparent}
.rpick:hover{background:var(--card2)}
.rpick.on{background:color-mix(in srgb,var(--accent) 10%,var(--card));border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.rpick .tb{flex:1;min-width:0}.rpick b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rpick small{display:block;font-size:11.5px;color:var(--muted)}
.bom{display:flex;flex-direction:column;gap:8px}
.bh,.brow2{display:grid;grid-template-columns:minmax(0,1fr) 140px 90px 100px 30px;gap:8px;align-items:center}
.bh{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brow2 .cur span{font-weight:500;font-size:12px}
.cost .bigv{font-size:28px}

/* ================= stock count ================= */
.cbar{position:sticky;top:72px;z-index:5}
.cbar .tb b,.cbar .tb small{display:block}
.scanbox{max-width:520px}
.clist{display:flex;flex-direction:column;gap:7px}
.crow{display:grid;grid-template-columns:36px minmax(0,1fr) 110px 170px 92px;gap:12px;align-items:center;padding:9px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow2)}
.crow .tb{min-width:0}.crow b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.crow small{display:block;font-size:11.5px;color:var(--muted)}
.crow .exp b{font-size:14px}
.crow .cin{display:flex;gap:5px;align-items:center}.crow .cin input{text-align:center;padding:8px 4px}
.crow .dif{text-align:right}
.crow.ok{border-color:color-mix(in srgb,var(--good) 40%,var(--line));background:color-mix(in srgb,var(--good) 5%,var(--card))}
.crow.df{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 5%,var(--card))}
.crow.flash{animation:flash 1s ease}
@keyframes flash{0%{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 50%,transparent)}100%{box-shadow:var(--shadow2)}}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;cursor:pointer;transition:transform .15s,border-color .15s}
.opt:hover{transform:translateY(-2px);border-color:var(--accent)}
.opt .ic{width:24px;height:24px;color:var(--accent);margin-bottom:4px}.opt b{font-size:15px}.opt small{font-size:12px;color:var(--muted)}
.cring{flex:0 0 auto}

/* ================= reorder / suppliers ================= */
.card.po.received{opacity:.8}
.card.po .tb small{display:block}
.sup .list a,.sup .list span{display:flex;align-items:center;gap:6px;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sup .list .ic{width:14px;height:14px;color:var(--accent)}

/* ================= pricing ================= */
.pbreak{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:6px}
.pbreak div{background:var(--card2);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column}
.pbreak small{font-size:10.5px;color:var(--muted)}.pbreak b{font-size:14.5px}
.pbreak .t{background:color-mix(in srgb,var(--accent) 12%,var(--card))}.pbreak .t b{font-family:var(--serif);font-size:18px}
.pricebox{background:var(--lav)}
html[data-theme="dark"] .pricebox{background:#22324D}
.pricebox .bigv{font-size:40px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vs>div{display:flex;flex-direction:column;gap:1px;padding:10px 12px;border-radius:13px;background:var(--card2)}
.vs .hl{background:color-mix(in srgb,var(--good) 12%,var(--card))}
.vs small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.vs b{font-family:var(--serif);font-size:20px}.vs span{font-size:12px;color:var(--muted)}

/* ================= charts ================= */
.chart{position:relative}
.chart svg{width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--sans);font-size:11px;fill:var(--muted)}
.chart .gl{stroke:var(--line2);stroke-width:1}.chart .ax{stroke:var(--line);stroke-width:1}
.chart [data-tip]{cursor:pointer}.chart .hit{fill:transparent}
.legend{display:flex;gap:8px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut svg{flex:0 0 auto}
.donut .dl{flex:1;min-width:150px;display:flex;flex-direction:column;gap:6px}
.donut .dl div{display:flex;align-items:center;gap:8px;font-size:13px}
.donut .dl b{margin-left:auto;font-variant-numeric:tabular-nums}
#tt{position:fixed;z-index:200;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12px;box-shadow:var(--shadow);opacity:0;transition:opacity .1s;max-width:270px;white-space:pre-line}
#tt.on{opacity:1}

/* ================= toasts & fx ================= */
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:150;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;background:#0B1424;color:#CFE3F2;padding:11px 16px;border-radius:14px;box-shadow:0 14px 34px rgba(11,20,36,.35);font-size:13.5px;font-weight:500;animation:pop .25s;max-width:min(92vw,480px);border:1px solid rgba(125,211,200,.25)}
.toast .ic{color:#7DD3C8;width:17px;height:17px}
.toast.bad{background:#5A1424}
.toast button{color:#7DD3C8;font-weight:700}
#fx{position:fixed;inset:0;pointer-events:none;z-index:180}

/* ================= responsive ================= */
@media (max-height:1020px){.nav .st:not(.on) .tx small{display:none}}
@media (max-height:880px){.nav .st{padding:6px 10px}.nav .gl{padding-top:10px}}
@media (max-height:740px){.nav .st{padding:4px 10px}.nav .gl{padding:7px 0 3px 50px}}
@media (max-height:1000px) and (min-width:981px){.sbox{display:none}}
@media (max-height:820px) and (min-width:981px){.brand{padding:14px 18px 10px}.sfoot{padding:8px 14px 10px}}
.navx{flex:0 0 auto;overflow:visible;padding-top:0;border-top:1px solid rgba(207,227,242,.1)}
.navx .st::before{display:none}
.navx .gl{padding-top:10px}
@media (max-height:660px) and (min-width:981px){.nav .gl{padding:8px 0 3px 50px}.nav .st .n{width:24px;height:24px;flex-basis:24px}}
@media (max-width:1320px){.qa.big{grid-template-columns:repeat(3,minmax(0,1fr))}.flow{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.sumup{grid-template-columns:repeat(3,minmax(0,1fr))}.sumup .pf{grid-column:span 3}.g21{grid-template-columns:minmax(0,1fr)}.hide-md{display:none}.rgrid{grid-template-columns:minmax(0,1fr)}.rlist{position:static;max-height:300px}}
@media (max-width:980px){
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;transform:translateX(-104%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
  .side{z-index:70}
  .side.open{transform:none;box-shadow:20px 0 60px rgba(11,20,36,.45)}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(11,20,36,.5);z-index:65}
  .top .burger{display:grid}
  .g3,.rgrid{grid-template-columns:minmax(0,1fr)}
  .rlist{position:static;max-height:300px}
  .top{padding:10px 16px}
  .view{padding:18px 16px 110px}
  .crow{grid-template-columns:36px minmax(0,1fr) 150px;}
  .crow .exp{grid-column:2}.crow .cin{grid-column:3;grid-row:1/3}.crow .dif{grid-column:2;text-align:left}
  .gs .gsl{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pbreak{grid-template-columns:repeat(3,minmax(0,1fr))}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:44;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(11,20,36,.08)}
  .bnav button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);padding:5px 0;border-radius:10px}
  .bnav button .ic{width:20px;height:20px}
  .bnav button.on{color:var(--accent);background:var(--card2)}
  .bnav button.pri span{width:46px;height:46px;margin-top:-20px;border-radius:50%;display:grid;place-items:center;background:#1E3A66;color:#fff;box-shadow:0 8px 20px rgba(30,58,102,.45)}
  .bnav button.pri{color:var(--accent)}
  .bnav .bdot{position:absolute;top:3px;left:calc(50% + 7px);width:8px;height:8px;border-radius:50%;background:var(--bad)}.bnav .bdot.warn{background:#E9B24C}.bnav .bdot:not(.warn):not(.bad){background:var(--lav)}
  .toasts{bottom:92px}
}
@media (max-width:760px){
  .top{flex-wrap:wrap;gap:8px 10px}
  .crumb{flex:1}
  .srch{order:3;flex:1 0 100%;max-width:none;margin:0}
  .srch2{flex:1 0 100%;max-width:none}
  .g2,.g4,.defs,.gs3{grid-template-columns:minmax(0,1fr)}
  .gs3{gap:8px}.gs3>div:not(:last-child)::after{right:auto;left:26px;top:auto;bottom:-9px;transform:rotate(135deg)}
  .phead h1{font-size:25px}
  .phead .pa{width:100%}.phead .pa .btn{flex:1}
  .qa.big{grid-template-columns:repeat(2,minmax(0,1fr))}
  .flow,.flow.mini{grid-template-columns:repeat(2,minmax(0,1fr))}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lh{display:none}
  .line{grid-template-columns:minmax(0,1fr) 64px 30px;grid-template-areas:"i q x" "p t t";row-gap:6px;padding:8px;border-radius:12px;background:var(--card2)}
  .line .li{grid-area:i}.line .lq{grid-area:q}.line .lx{grid-area:x}.line .cur{grid-area:p}.line .lt{grid-area:t}
  .line .cur{background:var(--card)}
  .sumup{grid-template-columns:repeat(2,minmax(0,1fr))}.sumup .pf{grid-column:span 2}
  .bh{display:none}.brow2{grid-template-columns:minmax(0,1fr) 110px 30px}.brow2 span.sub{display:none}
  .tools select{flex:1;min-width:0}
  .gs .gsl{grid-template-columns:minmax(0,1fr)}
  .sphere{min-height:400px}
  .sphere.shelf{min-height:430px!important}
  .sphere .ov{flex-direction:column}
  .sphere .hint{display:none}

/* =====================================================================
   "Christmas Pine & Gold" — clean, airy, easy to read.
   Lilac #B8935A (brand) · deep lilac #214328 (actions) · ink #1E1A14 · white
   One font family, soft surfaces, lots of space, colour only where it means something.
   ===================================================================== */
:root{
  --lilac:#B8935A;--lilac-d:#214328;--lilac-l:#F4ECDD;--lilac-m:#E8D8BE;
  --mid:#1E1A14;--violet:#214328;--lav:#B8935A;--pale:#F4ECDD;
  --bg:#FAF6EE;--bg2:#F2EADB;--panel:#FFFFFF;--card:#FFFFFF;--card2:#FBF7EF;--card3:#F0E6D3;
  --line:#E8DCC6;--line2:#F2EADB;
  --ink:#1E1A14;--ink2:#3A3328;--muted:#786B58;--faint:#A8987E;
  --accent:#214328;--accent2:#5F4073;--btn:#214328;--btn2:#5E0206;--onbtn:#fff;
  --good:#2F7A4B;--warn:#B07A12;--bad:#A3242C;--coral:#A3242C;--teal:#214328;
  --shadow:0 20px 50px rgba(40,30,15,.12);--shadow2:0 1px 2px rgba(40,30,15,.04),0 4px 14px rgba(40,30,15,.04);
  --serif:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --sans:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --r:16px;--r2:12px;
}
html[data-theme="dark"]{
  --bg:#0F1A12;--bg2:#1A161F;--panel:#16241A;--card:#16241A;--card2:#1C2E21;--card3:#263B2B;
  --line:#2A3D2E;--line2:#1F3123;
  --ink:#F6EFE2;--ink2:#E8DCC6;--muted:#B3A68C;--faint:#8A7D63;
  --accent:#D9C391;--accent2:#E8D8BE;--btn:#B8935A;--btn2:#C9A46A;--onbtn:#fff;
  --lilac-l:#22301F;--lilac-m:#33452F;
  --good:#5CC48D;--warn:#E0B15A;--bad:#EF7F92;--coral:#EE8CAB;
  --shadow:0 20px 50px rgba(0,0,0,.5);--shadow2:0 1px 2px rgba(0,0,0,.3);
}
body{font-family:var(--sans);font-size:14.5px;background:var(--bg);color:var(--ink)}
body::before,body::after{display:none}
h1,h2,h3,.serif{font-family:var(--sans);font-weight:700;letter-spacing:-.02em}
h3{font-size:15px;display:flex;align-items:center;gap:8px}
h3 .ic{color:var(--lilac-d);width:17px;height:17px}
html[data-theme="dark"] h3 .ic{color:var(--accent)}
::selection{background:var(--lilac-m)}

/* ---------- sidebar: white, quiet, one clear "you are here" ---------- */
.side{background:var(--panel);color:var(--ink);box-shadow:none;border-right:1px solid var(--line);width:256px;flex-basis:256px}
.side::after{display:none}
.brand{border-bottom:1px solid var(--line2);padding:20px 18px 16px}
.brand .mk{background:var(--lilac);box-shadow:none;border-radius:12px;width:38px;height:38px;flex-basis:38px}
.brand b{font-family:var(--sans);font-weight:700;font-size:16px;color:var(--ink);letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:11px;letter-spacing:.02em;text-transform:none;font-weight:500}
.nav{padding:8px 12px}
.nav .gl{color:var(--faint);font-size:10.5px;letter-spacing:.12em;padding:14px 10px 6px}
.nav .st{padding:8px 10px;border-radius:10px;gap:10px;color:var(--ink2);border:0}
.nav .st::before{display:none}
.nav .st .n{width:22px;height:22px;flex:0 0 22px;font-size:11px;background:var(--card3);color:var(--muted);border:0}
.nav .st .n .ic{width:12px;height:12px}
.nav .st .tx b{color:var(--ink2);font-weight:600;font-size:13.5px}
.nav .st .tx b .ic{display:none}
.nav .st .tx small{display:none!important}
.nav .st:hover{background:var(--card2)}
.nav .st.done .n{background:var(--lilac-m);color:var(--lilac-d)}

/* ornament avatars */
.orn{position:relative;display:inline-grid;place-items:center;flex:0 0 auto;border-radius:50%;font-weight:700;color:#fff;background:var(--c);box-shadow:0 3px 8px rgba(0,0,0,.18)}

.orn::after{content:"";position:absolute;inset:auto auto -2px -2px;width:34%;height:34%;border-radius:50%;border:2px solid var(--card);display:none}
.orn.ready::after,.orn.given::after{display:block;background:#2F7A4B}.orn.none::after{display:block;background:#C9B48C}
/* hero with the 3D tree */
.xhero{position:relative;min-height:600px;border-radius:28px;overflow:hidden;color:#fff;margin-top:6px;
 background:#0B1F12;box-shadow:0 24px 60px rgba(15,36,22,.35)}

.xbtn:hover{transform:translateY(-2px)}.xbtn .ic,.xbtn2 .ic{width:16px;height:16px}
.xbtn2{display:inline-flex;align-items:center;gap:7px;padding:11px 16px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(217,195,145,.35);color:#fff;font-weight:600;font-size:13.5px}
.xleg{position:absolute;right:22px;bottom:16px;display:flex;gap:14px;font-size:11.5px;color:rgba(255,255,255,.8);z-index:2;flex-wrap:wrap;justify-content:flex-end}
.xleg span{display:flex;align-items:center;gap:6px}.xleg i{width:11px;height:11px;border-radius:50%;display:inline-block}
.xleg .o-ready{background:#C9A46A}.xleg .o-going{background:#8E0F17;box-shadow:0 0 0 1px rgba(255,255,255,.4)}.xleg .o-none{background:#E8D8BE}.xleg .faint{color:rgba(255,255,255,.55)}
.xhero0{text-align:center}
/* pipeline */
.pipe{display:flex;align-items:center;gap:4px;overflow-x:auto}
.pipe button{flex:1;min-width:92px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 6px;border-radius:14px;background:var(--card2);border:1px solid var(--line);transition:transform .15s}

.pipe .pa{color:var(--faint);flex:0 0 auto}.pipe .pa .ic{width:14px;height:14px}
/* gift status colours */
.gic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:0 0 34px;background:var(--card3);color:var(--muted)}

.st-idea.gic,.gd.st-idea{background:#F0E6D3;color:#9D865D}.st-bought.gic,.gd.st-bought{background:#F7E9C9;color:#8E6A1F}.st-shipping.gic,.gd.st-shipping{background:#DCE8EF;color:#3F6F8F}.st-arrived.gic,.gd.st-arrived{background:#E1EBDA;color:#4C6E3D}.st-wrapped.gic,.gd.st-wrapped{background:#F5DADB;color:#750207}.st-given.gic,.gd.st-given{background:#D6E6DA;color:#214328}

.pill.sg-idea{background:#F0E6D3;color:#7A6A4C}.pill.sg-bought{background:#F7E9C9;color:#7A5A14}.pill.sg-shipping{background:#DCE8EF;color:#2F5A75}.pill.sg-arrived{background:#E1EBDA;color:#3F5E31}.pill.sg-wrapped{background:#F5DADB;color:#750207}.pill.sg-given{background:#D6E6DA;color:#214328}
/* nice list cards */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow2);position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.pcard:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(40,30,15,.1)}
.pcard::after{content:"";position:absolute;right:-26px;top:-26px;width:80px;height:80px;border-radius:50%;background:none}
.pcard .row1{display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.pcard .row1 .tb{flex:1;min-width:0;display:flex;flex-direction:column}.pcard .row1 b{font-size:16px;font-family:var(--serif2)}.pcard .row1 small{font-size:12px;color:var(--muted)}
.pst{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--card3);color:var(--muted);white-space:nowrap}
.pcard.st-ready .pst,.pcard.st-given .pst{background:#D6E6DA;color:#214328}.pcard.st-none .pst{background:#F5DADB;color:#750207}.pcard.st-going .pst{background:#F7E9C9;color:#7A5A14}
.gdots{display:flex;gap:5px;flex-wrap:wrap;min-height:28px;align-items:center}
.gd{width:28px;height:28px;border-radius:9px;display:grid;place-items:center}.gd .ic{width:14px;height:14px}
.pbud{font-size:12.5px}.pbud .bar{margin-top:6px}
.prow{display:flex;gap:6px;align-items:center;padding-top:10px;border-top:1px solid var(--line2)}
/* person panel / rows */
.grow2{display:flex;align-items:center;gap:8px}
.grow2 .gl2{flex:1;display:flex;align-items:center;gap:11px;padding:8px;border-radius:12px;text-align:left;min-width:0}
.grow2 .gl2:hover{background:var(--card2)}.grow2 .tb{flex:1;min-width:0;display:flex;flex-direction:column}.grow2 .tb b{font-size:13.5px}.grow2 .tb small{font-size:11.8px;color:var(--muted)}
.note2{background:var(--card2);border-radius:12px;padding:10px 12px;font-size:12.5px;display:flex;flex-direction:column;gap:4px}.note2 b{display:flex;align-items:center;gap:6px;font-size:12px}.note2 .ic{width:14px;height:14px;color:var(--berry)}
.aic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--card3);color:var(--berry);flex:0 0 34px}.aic .ic{width:17px;height:17px}
.alrow.bad .aic{background:#F5DADB}.alrow.warn .aic{background:#F7E9C9;color:#8E6A1F}
.srch .res .gic{width:28px;height:28px;flex-basis:28px;border-radius:9px}
.idea{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:var(--card2)}.idea .tb{flex:1;min-width:0;display:flex;flex-direction:column}.idea .tb small{font-size:11.8px;color:var(--muted)}
/* board */
.board{display:grid;grid-template-columns:repeat(6,minmax(170px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.bcol{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:240px;border-top:4px solid var(--c)}
.bh{display:flex;align-items:center;gap:7px;font-size:13px;padding:2px 4px}.bh span{color:var(--c)}.bh .ic{width:16px;height:16px}.bh i{margin-left:auto;font-style:normal;font-size:11.5px;font-weight:700;background:var(--card);border-radius:999px;padding:1px 8px;color:var(--muted)}
.bl{display:flex;flex-direction:column;gap:7px}
.bcard{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow2);overflow:hidden}
.bcard .bt{flex:1;display:flex;flex-direction:column;gap:4px;padding:9px 10px;text-align:left;min-width:0}.bcard .bt b{font-size:13px}.bcard .bt small{font-size:11.3px;color:var(--muted)}
.bmv{width:30px;display:grid;place-items:center;border-left:1px solid var(--line2);color:var(--berry)}.bmv:hover{background:#F5DADB}.bmv .ic{width:15px;height:15px}
.bempty{text-align:center;color:var(--faint);padding:14px 0}
/* deliveries */
.parcel{display:flex;align-items:center;gap:11px;padding:10px;border-radius:14px;background:var(--card2);border:1px solid var(--line2)}
.parcel.late{border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 6%,var(--card))}
.parcel .tb{flex:1;min-width:0;display:flex;flex-direction:column}.parcel .tb small{font-size:11.8px;color:var(--muted)}
.eta{display:flex;flex-direction:column;align-items:flex-end;min-width:76px}.eta small{font-size:10.5px;color:var(--muted)}.eta b{font-size:14px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}
.tl2{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.dl{display:flex;align-items:center;gap:12px;padding:8px 6px;position:relative}
.dl i{width:12px;height:12px;border-radius:50%;background:var(--gold);flex:0 0 12px;box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 20%,transparent)}
.dl::before{content:"";position:absolute;left:11.5px;top:-6px;bottom:-6px;width:1px;background:var(--line)}
.dl span{flex:1;display:flex;flex-direction:column}.dl small{font-size:12px;color:var(--muted)}.dl em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--muted)}
.dl.past{opacity:.5}.dl.soon i{background:var(--bad);box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 20%,transparent)}.dl.soon em{color:var(--bad)}
.dl.xm i{background:var(--berry)}.dl.xm b{color:var(--berry)}
.dlrow{display:grid;grid-template-columns:170px 1fr 32px;gap:8px;align-items:center}
/* wrapping */
.wrow{display:flex;align-items:center;gap:11px;padding:9px;border-radius:13px;background:var(--card2)}
.wrow .tb{flex:1;min-width:0;display:flex;flex-direction:column}.wrow .tb small{font-size:11.8px;color:var(--muted)}.wrow.done{opacity:.6}
.wrapc{text-align:center}.wrapc .wrapring{display:flex;justify-content:center}.wrapc .tips2{text-align:left}
.tagprev{display:flex;gap:14px;flex-wrap:wrap}
.gtag{position:relative;width:200px;height:118px;border-radius:12px 34px 34px 12px;background:var(--b);color:var(--a);border:2px solid var(--a);padding:14px 16px 10px 34px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 6px 16px rgba(40,30,15,.12);overflow:hidden}
.gtag .hole{position:absolute;left:12px;top:50%;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--a);transform:translateY(-50%)}
.gtag .tl{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.gtag b{font-family:var(--serif2);font-size:17px;line-height:1.1;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtag em{position:absolute;right:14px;bottom:8px;font-family:var(--serif2);font-style:italic;font-size:11px;opacity:.8}
.gtag .tsprig{position:absolute;right:10px;top:8px;width:42px;color:var(--a);opacity:.85}
.tagsheet{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:10mm}
.tagsheet .gtag{width:auto;height:44mm;-webkit-print-color-adjust:exact;print-color-adjust:exact;box-shadow:none}
/* cards */
.cardt td.addr{white-space:pre-wrap;font-size:12.5px;color:var(--muted);max-width:340px}
.cardt tr.done td b{text-decoration:line-through;color:var(--muted)}
/* santa */
.smem{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:var(--card2)}.smem .tb{flex:1;min-width:0;display:flex;flex-direction:column}.smem .tb small{font-size:11.5px;color:var(--muted)}
.sav{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:0 0 34px;font-weight:700;font-size:12.5px;color:#fff;background:#750207}
.santac{background:#FFFDF8;position:relative;overflow:hidden}
html[data-theme="dark"] .santac{background:#1C2E21}
.santab{width:100%;padding:14px;font-size:15px;margin-top:6px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}
.sreveal{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 8px;border-radius:14px;background:var(--card);border:1px dashed var(--gold);transition:transform .15s}
.sreveal:hover{transform:translateY(-2px);border-style:solid}.sreveal small{font-size:11px;color:var(--muted)}
.srev{text-align:center;padding:10px 4px}.srev .btn{margin-top:12px}.sname{font-family:var(--serif2);font-size:44px;color:var(--berry);margin:6px 0}
.slips{display:grid;grid-template-columns:repeat(2,1fr);gap:10mm;padding:10mm}.slip{border:1.5px dashed #9D865D;padding:8mm;text-align:center;display:flex;flex-direction:column;gap:3mm}.slip .fold{border-top:1px dashed #ccc;padding-top:3mm;font-size:11px;color:#777}.slip .big{font-size:22px}
.cs2{font-weight:700;color:var(--muted);font-size:18px}
.kv4 .kvb b{font-family:var(--serif2)}
@media (max-width:1100px){.board{grid-template-columns:repeat(6,190px)}}
@media (max-width:760px){
 .xhero{min-height:0;display:flex;flex-direction:column}
 .xl{position:relative;left:auto;top:auto;width:auto;padding:24px 20px 0}
 .xhero canvas{position:relative;inset:auto;height:380px;order:2}
 .xleg{position:relative;right:auto;bottom:auto;order:3;justify-content:center;padding:0 12px 16px}
 .xcount b{font-size:68px}.xbtns .xbtn2{display:none}
 .dlrow{grid-template-columns:1fr 32px}.dlrow input[type=text]{grid-column:1}
 .gtag{width:100%}
}
@media print{.tagsheet,.slips{display:grid}}
/* ============ SOLID Christmas theme · no gradients · bigger text ============ */
:root{--berry:#750207;--red:#A3141C;--pine:#214328;--gold:#C9AB87;--btn:#750207;--bg:#F6EFE2;--card:#FFFDF8;--card2:#FBF5EA;--line:#E6D9C2;--line2:#EFE5D3}
html[data-theme="dark"]{--bg:#0F1A12;--card:#17251B;--card2:#1C2D21;--btn:#A3141C}
body{background:var(--bg)!important;font-size:16px}
body::before{display:none!important}
/* sidebar */
.side{background:#14301C!important;border-right:4px solid var(--berry)}
.brand .mk{background:var(--berry)!important}
.brand b{font-size:21px}
.nav .gl{font-size:11.5px;color:#C9AB87!important;letter-spacing:.16em}
.nav .st{padding-top:9px!important;padding-bottom:9px!important}
.nav .st .tx b{font-size:16px!important}
.nav .st .n{width:30px;height:30px;flex-basis:30px;font-size:13px;background:#0D2214;color:#E8D8BE;border-color:rgba(232,216,190,.35)}
.nav .st.on{background:var(--berry)!important;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.nav .st.on .tx b{color:#fff!important}
.nav .st.on .n{background:#FFF8EC!important;color:var(--berry)!important;border-color:#FFF8EC}
.nav .st.done .n{background:#C9AB87!important;color:#14301C;border-color:#C9AB87}
.nav .bd{background:#C9AB87!important;color:#14301C;font-size:12px;min-width:22px;height:22px}
.sfoot button{font-size:14px}
/* buttons */
.btn{font-size:15px!important;padding:11px 18px!important;border-radius:12px!important}
.btn:not(.soft):not(.ghost):not(.danger){background:var(--berry)!important;color:#fff!important;box-shadow:0 4px 0 #4A0104!important}
.btn:not(.soft):not(.ghost):not(.danger):hover{background:var(--red)!important}
.btn.soft{background:#F3E4E2;color:var(--berry)}
.btn.sm{font-size:13.5px!important;padding:7px 12px!important}
/* banner */
.pban{position:relative;overflow:hidden;border-radius:24px;padding:46px 30px 26px;min-height:230px;align-items:center!important;flex-wrap:nowrap!important;margin-bottom:24px!important;color:#FFF8EC;box-shadow:0 14px 30px rgba(60,10,10,.18)}
.pban.b-red{background:var(--berry)}
.pban.b-pine{background:#1A3A22}
.pban::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:repeating-linear-gradient(90deg,#FFF8EC 0 18px,#A3141C 18px 36px)}
.pban.b-pine::after{background:repeating-linear-gradient(90deg,#FFF8EC 0 18px,#C9AB87 18px 36px)}
.plights{position:absolute;left:0;top:0;width:100%;height:40px}
.plights .lb{animation:blink 2.2s infinite}
@keyframes blink{50%{opacity:.45}}
.pban .pl{position:relative;z-index:2;flex:1;min-width:0}
.pban .scr{display:inline-block;background:#FFF8EC;color:var(--berry)!important;font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:5px 12px;border-radius:999px}
.pban.b-pine .scr{color:#1A3A22!important}
.pban h1{font-size:46px!important;color:#FFF8EC;margin-top:12px!important}
.pban p{color:#F1E4CC!important;font-size:17px!important;max-width:560px!important;margin-top:6px}
.pban .pa{margin-top:18px}
.pban .btn:not(.soft):not(.ghost):not(.danger){background:#C9AB87!important;color:#1A1009!important;box-shadow:0 4px 0 #6D4220!important}
.pban .btn:not(.soft):not(.ghost):not(.danger):hover{background:#E8D8BE!important}
.pban .btn.ghost{background:transparent!important;color:#FFF8EC!important;border:1.5px solid rgba(255,248,236,.5)!important}
.part{position:relative;z-index:1;width:330px;flex:0 0 330px;align-self:flex-end;margin:-10px -6px -14px 0}
.part svg{width:100%;height:auto;display:block}
/* cards & text */
.card{border-radius:20px!important;border:1px solid var(--line)!important;box-shadow:0 2px 0 var(--line)!important;background:var(--card)!important}
.card h3,h3{font-size:19px!important}
.card h3 .ic{color:var(--berry)!important}
table{font-size:15px}
th{font-size:12.5px!important}
[class] small,.muted{font-size:13.5px!important}
.tb b,.bt b,.row1 b{font-size:16px!important}
.pill,.pst{font-size:12.5px!important}
input,select,textarea{font-size:15.5px!important}
.stat .v,.sumbar b{font-size:28px!important}
.bar i,.xbar i,.sbox .bar i{background:var(--berry)!important}
.xbar i{background:#C9AB87!important}
.guide{background:#FBF1E6!important;border:1.5px dashed #C9AB87!important}
/* hero solid */
.xhero{background:#14301C!important}
.xhero::before{display:none}
